<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="记录人类完蛋全过程——从计算机出现到每一个值得记下的模型，各个领域还剩多少人类的事。" />
  <title>记录人类完蛋全过程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div class="theme-switcher" role="group" aria-label="界面主题">
    <button type="button" class="theme-btn" data-theme="dark" aria-pressed="true" title="终末地暗色">暗</button>
    <button type="button" class="theme-btn" data-theme="paper" aria-pressed="false" title="工业蓝白">纸</button>
    <button type="button" class="theme-btn" data-theme="signal" aria-pressed="false" title="信号琥珀">信</button>
  </div>
  <a class="skip" href="#chapter-dossier">跳到领域血条</a>

  <main class="chapter-scroller" id="chapter-scroller">
    <!-- Shared morph: gauge ring → middle rail; years scatter into ticks -->
    <svg class="morph-layer" id="morph-layer" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="none">
      <path id="morph-arc" fill="none" stroke="#f5e11a" stroke-width="2.4" stroke-linecap="round"></path>
      <line id="morph-rail" x1="120" y1="480" x2="120" y2="480" stroke="#f5e11a" stroke-width="1.6" opacity="0"></line>
      <g id="morph-ticks"></g>
      <text id="morph-y0" class="morph-glyph" fill="rgba(232,238,248,0.45)" font-family="Instrument Serif, serif" font-size="42" text-anchor="middle">1946</text>
      <text id="morph-y1" class="morph-glyph" fill="rgba(245,225,26,0.4)" font-family="Instrument Serif, serif" font-size="42" text-anchor="middle">2026</text>
      <text id="morph-pct" fill="rgba(232,238,248,0.35)" font-family="Instrument Serif, serif" font-size="28" text-anchor="middle">36%</text>
    </svg>
    <p class="era-now" id="era-now" aria-live="polite"></p>
    <!-- PAGE 1: dossier / domain HP -->
    <section class="chapter chapter-dossier" id="chapter-dossier" aria-label="领域血条">
      <div class="dossier-inner page">
        <div class="dossier-strip" aria-label="档案抬头">
          <span class="dossier-bracket">[</span>
          <span class="dossier-key">档案</span>
          <time id="updated-date" datetime="2026-09-30">—</time>
          <span class="dossier-bracket">]</span>
          <span class="dossier-rule" aria-hidden="true"></span>
        </div>

        <header class="mast mast-hero" id="top">
          <aside class="mast-rail" aria-label="概览">
            <h1 class="mast-title" id="site-title">记录人类完蛋全过程</h1>
            <p class="mast-subtitle" id="site-subtitle"></p>
            <div class="aggregate" aria-live="polite">
              <svg class="aggregate-ring" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="44"></circle>
                <circle class="ring-val" id="aggregate-ring-val" cx="50" cy="50" r="44"></circle>
              </svg>
              <p class="aggregate-value">
                <span id="aggregate-num">—</span><span class="aggregate-unit">%</span>
              </p>
              <p class="aggregate-label">人类事务剩余</p>
              <p class="aggregate-note" id="score-disclaimer"></p>
            </div>
          </aside>

          <section class="mast-domains" id="domains" aria-labelledby="domains-heading">
            <div class="domains-head">
              <h2 id="domains-heading" class="section-title">
                <span class="sec-mark">01</span>
                <span class="sec-label">领域索引</span>
                <span class="sec-hint">点击展开子项 · 父级为叶节点算术平均</span>
              </h2>
            </div>
            <div id="domain-tree" class="domain-tree" role="tree"></div>
          </section>
        </header>

        <a class="chapter-cue" href="#chapter-timeline"><span class="cue-cap">继续下探</span><span class="cue-mark" aria-hidden="true"></span></a>
        <div class="blend-veil" aria-hidden="true"></div>
      </div>
    </section>

    <!-- PAGE 2: timeline -->
    <section class="chapter chapter-timeline" id="chapter-timeline" aria-label="时间线">
      <div class="timeline-section" id="timeline" aria-labelledby="timeline-heading">
        <div class="timeline-chrome">
          <div class="section-head">
            <h2 id="timeline-heading" class="section-title">
              <span class="sec-mark">02</span>
              <span class="sec-label">时间线</span>
              <span class="sec-hint">自 ENIAC 起 · 点的大小与颜色表示影响力</span>
            </h2>
          </div>
          <div class="era-filters" id="era-filters" role="group" aria-label="按时代筛选"></div>
        </div>

        <div class="axis-stage" id="axis-stage" data-motif="foundation">
          <div class="field-parallax" id="field-parallax" aria-hidden="true">
            <div class="field-layer field-l0"></div>
            <div class="field-layer field-l1"></div>
            <div class="field-layer field-l2"></div>
            <div class="field-noise"></div>
          </div>
          <div class="story-stage" id="story-stage" aria-hidden="true">
            <span class="field-axis-label">三轨时间轴</span>
          </div>
          <ul class="track-legend" aria-hidden="true">
            <li>语言与推理</li>
            <li>图像与创作</li>
            <li>棋与控制</li>
          </ul>

          <p class="playhead-year" id="playhead-year" aria-hidden="true">—</p>

          <div
            class="axis-viewport"
            id="axis-viewport"
            tabindex="0"
            role="region"
            aria-label="横向时间轴，可用方向键与滚轮浏览"
            aria-roledescription="时间轴"
          >
            <div class="axis-track" id="timeline-list"></div>
          </div>

          <div class="axis-readout" id="axis-detail" aria-live="polite">
            <p class="readout-year" id="readout-year">—</p>
            <p class="readout-meta" id="readout-meta"></p>
            <h3 class="readout-title" id="readout-title">选取轴上节点</h3>
            <p class="readout-blurb" id="readout-blurb">在轴上选取一个节点，查看日期、标题与摘要。</p>
            <div class="readout-tags" id="readout-tags"></div>
          </div>

          <p class="axis-hint" id="axis-hint">拖拽轴面 · 滚轮横移 · ← → 选点 · 悬停暂停</p>
        </div>
      </div>

      <div class="timeline-foot-space" aria-hidden="true"></div>
      <footer class="site-footer chapter-foot">
        <p>血条是估算，不是测量。每天核对一次。</p>
      </footer>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="stories.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
