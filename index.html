<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="记录人类完蛋全过程——从计算机出现到每一个值得记下的模型，各个领域还剩多少人类的事。" />
  <title>记录人类完蛋全过程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#domains">跳到领域血条</a>

  <div class="page page-mast">
    <div class="dossier-strip" aria-label="档案抬头">
      <span class="dossier-bracket">[</span>
      <span class="dossier-key">档案</span>
      <time id="updated-date" datetime="2026-09-30">—</time>
      <span class="dossier-bracket">]</span>
      <span class="dossier-rule" aria-hidden="true"></span>
    </div>

    <header class="mast" id="top">
      <aside class="mast-rail" aria-label="概览">
        <h1 class="mast-title" id="site-title">记录人类完蛋全过程</h1>
        <p class="mast-subtitle" id="site-subtitle"></p>

        <div class="aggregate" aria-live="polite">
          <p class="aggregate-value">
            <span id="aggregate-num">—</span><span class="aggregate-unit">%</span>
          </p>
          <p class="aggregate-label">人类事务剩余</p>
          <p class="aggregate-note" id="score-disclaimer"></p>
        </div>
      </aside>

      <section class="mast-domains" id="domains" aria-labelledby="domains-heading">
        <div class="domains-head">
          <h2 id="domains-heading" class="section-title">
            <span class="sec-mark">01</span>
            <span class="sec-label">领域索引</span>
            <span class="sec-hint">点击展开子项 · 父级为叶节点算术平均</span>
          </h2>
        </div>
        <div id="domain-tree" class="domain-tree" role="tree"></div>
      </section>
    </header>
  </div>

  <section class="timeline-section" id="timeline" aria-labelledby="timeline-heading">
    <div class="timeline-chrome">
      <div class="section-head">
        <h2 id="timeline-heading" class="section-title">
          <span class="sec-mark">02</span>
          <span class="sec-label">时间线</span>
          <span class="sec-hint">自 ENIAC 起，只收录可核验、影响显著的里程碑</span>
        </h2>
      </div>
      <div class="era-filters" id="era-filters" role="group" aria-label="按时代筛选"></div>
    </div>

    <div class="axis-stage" id="axis-stage" data-motif="foundation">
      <div class="axis-field" id="axis-field" aria-hidden="true">
        <span class="field-ghost-num" id="field-ghost-num">1946</span>
        <span class="field-tag" id="field-tag">奠基</span>
        <span class="field-axis-label">X AXIS</span>
        <svg class="motif-svg" id="motif-svg" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
          <!-- 奠基: sparse ruled grid + single ring -->
          <g class="motif-scene motif-scene--foundation" data-scene="foundation">
            <g class="motif-rules" stroke="#1d4e89" stroke-width="1" fill="none" opacity="0.35">
              <line x1="80" y1="200" x2="560" y2="200"/>
              <line x1="80" y1="320" x2="560" y2="320"/>
              <line x1="80" y1="440" x2="560" y2="440"/>
              <line x1="160" y1="120" x2="160" y2="520"/>
              <line x1="320" y1="120" x2="320" y2="520"/>
              <line x1="480" y1="120" x2="480" y2="520"/>
            </g>
            <circle class="motif-spin-slow" cx="320" cy="320" r="118" fill="none" stroke="#1d4e89" stroke-width="1.25" opacity="0.55"/>
            <circle cx="320" cy="320" r="4" fill="#2f6fed" opacity="0.7"/>
            <path d="M320 190 L324 200 L320 210 L316 200 Z" fill="#1d4e89" opacity="0.5"/>
          </g>
          <!-- 深度学习: denser linked nodes -->
          <g class="motif-scene motif-scene--deep" data-scene="deep">
            <g stroke="#1d4e89" stroke-width="1" fill="none" opacity="0.4">
              <line class="motif-pulse" x1="180" y1="260" x2="280" y2="320"/>
              <line class="motif-pulse" x1="280" y1="320" x2="400" y2="250"/>
              <line class="motif-pulse" x1="280" y1="320" x2="360" y2="400"/>
              <line x1="400" y1="250" x2="480" y2="300"/>
              <line x1="360" y1="400" x2="460" y2="380"/>
              <line x1="180" y1="260" x2="220" y2="380"/>
              <line x1="220" y1="380" x2="360" y2="400"/>
              <line x1="400" y1="250" x2="360" y2="400"/>
            </g>
            <g fill="#2f6fed">
              <circle cx="180" cy="260" r="5"/><circle cx="280" cy="320" r="7"/>
              <circle cx="400" cy="250" r="5"/><circle cx="360" cy="400" r="5"/>
              <circle cx="480" cy="300" r="4"/><circle cx="460" cy="380" r="4"/>
              <circle cx="220" cy="380" r="4"/>
            </g>
            <circle class="motif-spin-rev" cx="320" cy="320" r="160" fill="none" stroke="#1d4e89" stroke-dasharray="4 10" stroke-width="1" opacity="0.35"/>
          </g>
          <!-- Transformer / 生成爆发: offset arcs + crescent disk -->
          <g class="motif-scene motif-scene--orbit" data-scene="orbit">
            <circle class="motif-spin-slow" cx="320" cy="320" r="90" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.45"/>
            <circle class="motif-spin-rev" cx="320" cy="320" r="140" fill="none" stroke="#1d4e89" stroke-dasharray="2 8" stroke-width="1.25" opacity="0.5"/>
            <circle class="motif-spin-slow" cx="320" cy="320" r="190" fill="none" stroke="#16324f" stroke-dasharray="14 12" stroke-width="1" opacity="0.35"/>
            <circle class="motif-spin-rev" cx="320" cy="320" r="240" fill="none" stroke="#2f6fed" stroke-width="0.75" opacity="0.3"/>
            <g class="motif-crescent">
              <circle cx="320" cy="320" r="56" fill="#16324f" opacity="0.12"/>
              <circle cx="338" cy="308" r="48" fill="#f4f7fb"/>
              <circle cx="320" cy="320" r="56" fill="none" stroke="#1d4e89" stroke-width="1.25" opacity="0.55"/>
            </g>
            <g fill="none" stroke="#2f6fed" stroke-width="1.25" opacity="0.55">
              <path class="motif-spin-slow" d="M200 320 A120 120 0 0 1 320 200"/>
              <path class="motif-spin-rev" d="M440 320 A120 120 0 0 1 320 440"/>
              <path d="M320 200 A120 120 0 0 1 440 320"/>
            </g>
          </g>
          <!-- 2025–2026: tight crosshair lock + drifting ticks -->
          <g class="motif-scene motif-scene--lock" data-scene="lock">
            <circle class="motif-spin-fast" cx="320" cy="320" r="70" fill="none" stroke="#2f6fed" stroke-width="1.5" opacity="0.7"/>
            <circle class="motif-spin-rev" cx="320" cy="320" r="110" fill="none" stroke="#2f6fed" stroke-dasharray="3 7" stroke-width="1.25" opacity="0.55"/>
            <circle cx="320" cy="320" r="160" fill="none" stroke="#1d4e89" stroke-width="1" opacity="0.3"/>
            <g stroke="#2f6fed" stroke-width="1.25" opacity="0.75">
              <line x1="320" y1="120" x2="320" y2="250"/>
              <line x1="320" y1="390" x2="320" y2="520"/>
              <line x1="120" y1="320" x2="250" y2="320"/>
              <line x1="390" y1="320" x2="520" y2="320"/>
            </g>
            <rect x="300" y="300" width="40" height="40" fill="none" stroke="#2f6fed" stroke-width="1.25" opacity="0.8" transform="rotate(45 320 320)"/>
            <g class="motif-tick-drift" stroke="#1d4e89" stroke-width="1.5" opacity="0.55">
              <line x1="140" y1="300" x2="140" y2="340"/><line x1="170" y1="310" x2="170" y2="330"/>
              <line x1="200" y1="305" x2="200" y2="335"/><line x1="440" y1="300" x2="440" y2="340"/>
              <line x1="470" y1="310" x2="470" y2="330"/><line x1="500" y1="305" x2="500" y2="335"/>
            </g>
            <circle cx="320" cy="320" r="3" fill="#2f6fed"/>
          </g>
        </svg>
      </div>

      <div
        class="axis-viewport"
        id="axis-viewport"
        tabindex="0"
        role="region"
        aria-label="横向时间轴，可用方向键与滚轮浏览"
        aria-roledescription="时间轴"
      >
        <div class="axis-track" id="timeline-list"></div>
      </div>

      <div class="axis-readout" id="axis-detail" aria-live="polite">
        <p class="readout-year" id="readout-year">—</p>
        <p class="readout-meta" id="readout-meta"></p>
        <h3 class="readout-title" id="readout-title">选取轴上节点</h3>
        <p class="readout-blurb" id="readout-blurb">在轴上选取一个节点，查看日期、标题与摘要。</p>
        <div class="readout-tags" id="readout-tags"></div>
      </div>

      <p class="axis-hint" id="axis-hint">拖拽轴面 · 滚轮横移 · ← → 选点 · 悬停暂停漫游</p>
    </div>
  </section>

  <div class="page page-foot">
    <footer class="site-footer">
      <p>血条是估算，不是测量。每天核对一次。</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
